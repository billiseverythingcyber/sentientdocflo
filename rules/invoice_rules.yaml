invoice_number:
  patterns:
    - '(?i)invoice\s*#?\s*[:\-]?\s*([A-Z0-9\-]+)'
    - '(?i)inv\s*#?\s*[:\-]?\s*([A-Z0-9\-]+)'

invoice_date:
  patterns:
    - '(?i)date\s*[:\-]?\s*([0-9]{1,2}[\/\-][0-9]{1,2}[\/\-][0-9]{2,4})'
    - '(?i)invoice\s*date\s*[:\-]?\s*([A-Za-z]+\s+[0-9]{1,2},\s+[0-9]{4})'

amount_due:
  patterns:
    - '(?i)amount\s*due\s*[:\-]?\s*\$?([0-9,]+\.?[0-9]{0,2})'
    - '(?i)total\s*[:\-]?\s*\$?([0-9,]+\.?[0-9]{0,2})'